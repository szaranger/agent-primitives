[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-primitives"
version = "0.1.0"
description = "Reusable latent building blocks and distributed KV-cache communication."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "grpcio>=1.50.0",
    "PyJWT>=2.8.0",
    "redis>=4.5.0",
    "python-consul>=1.1.0"
]
